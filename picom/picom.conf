# Backend (required since picom v12)
backend = "glx";
vsync = true;

# Blur behind transparent windows
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
